name: Desktop application builds

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'desktop-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: Windows-x64
          - os: ubuntu-22.04
            artifact: Linux-x64
          - os: macos-15
            artifact: macOS-arm64
          - os: macos-15-intel
            artifact: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run desktop core tests
        run: python -m unittest discover -s desktop/tests -v
        env:
          PYTHONPATH: desktop
      - name: Run source self-test
        run: python desktop/launch.py --self-test
      - name: Exercise Tk widgets on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python desktop/scripts/gui_smoke.py
      - name: Exercise Tk widgets on Windows and macOS
        if: runner.os != 'Linux'
        run: python desktop/scripts/gui_smoke.py
      - name: Install pinned build dependency
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Build native standalone application
        run: python desktop/build_app.py
      - name: Package and hash application
        run: python desktop/package_release.py
      - name: Verify extracted standalone application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python desktop/scripts/artifact_smoke.py
      - name: Verify extracted standalone application on Windows and macOS
        if: runner.os != 'Linux'
        run: python desktop/scripts/artifact_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DHMS-${{ matrix.artifact }}
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'release' && github.event.release.tag_name == 'desktop-v1.0.0' && !github.event.release.prerelease
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release revision
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python -c "import runpy; assert runpy.run_path('desktop/build_app.py')['VERSION'] == '1.0.0'"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: DHMS-*
          merge-multiple: true
          path: release-assets
      - name: Attach tested platform downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(find release-assets -name '*.sha256' | wc -l)" -eq 4
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
